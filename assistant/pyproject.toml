[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-assistant"
version = "0.1.0"
description = "Scalable self-hosted LiveKit voice agent with a LangGraph brain"
requires-python = ">=3.11,<3.15"

dependencies = [
    "livekit-agents[langchain]>=1.7.0",
    "livekit-plugins-deepgram>=1.7.0",
    "livekit-plugins-openai>=1.7.0",
    "livekit-plugins-cartesia>=1.7.0",
    "livekit-plugins-silero>=1.7.0",
    "livekit-plugins-google>=1.7.0",
    "langgraph~=1.2",
    "langchain~=1.3",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-deepseek",
    "langgraph-checkpoint-sqlite",
    "pydantic-settings>=2.0",
    "asyncpg>=0.31",
    "pgvector>=0.5",
    "python-dotenv",
    "langchain-tavily>=0.2.18",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.8",
    "pyyaml>=6.0.3",
    "pypdf>=6.16.2",
    "beautifulsoup4>=4.15.0",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
# One project, two surfaces — named for the surface each one serves.
assistant-voice = "chat_assistant.main:main"  # LiveKit worker: console|dev|start
# Separate process, not a mode: cli.run_app() blocks and owns 8081/9091.
assistant-chat = "chat_assistant.http.main:main"  # text over HTTP

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chat_assistant = ["prompts/*.md", "capabilities/*.yaml", "retrieval/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
# N818: these exceptions are domain signals (PolicyDenied, BudgetExceeded,
# ToolTimeout) — the vocabulary the code reasons in, not error-suffix style.
ignore = ["E501", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
