# Postgres + pgvector for future graph specialists (doc extraction / RAG).
# Seam only today — nothing on the speaking path depends on it, so workers
# run fine while this is down.
#
# For production, PREFER MANAGED POSTGRES (RDS / Cloud SQL / AlloyDB — all
# support the pgvector extension): point the workers' DATABASE_URL at it
# and skip this manifest entirely. This StatefulSet is the self-contained
# in-cluster option for dev and small setups.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me # rotate before real use
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg18 # extension 0.8.6, Postgres 18
          env:
            - name: POSTGRES_USER
              value: voice
            - name: POSTGRES_DB
              value: voiceagent
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "voice", "-d", "voiceagent"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "voice", "-d", "voiceagent"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            # pg18+ convention: mount the parent; the image manages a
            # versioned data subdirectory inside (pg_upgrade-friendly).
            - name: storage
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
