# Template only — copy to secret.yaml (gitignored) or create with kubectl.
# LIVEKIT_URL points at the IN-CLUSTER SFU service, not the public URL:
# workers reach the SFU directly thanks to rtc.advertise_internal_ip.
apiVersion: v1
kind: Secret
metadata:
  name: chat-assistant-secrets
type: Opaque
stringData:
  LIVEKIT_URL: ws://livekit-server.livekit:7880
  LIVEKIT_API_KEY: <api-key>
  LIVEKIT_API_SECRET: <api-secret>
  LIVEKIT_AGENT_NAME: chat-assistant
  # STT + TTS both default to Deepgram — one key covers the audio pipeline.
  # TTS: "provider:model" — deepgram | cartesia. Cartesia needs its key back.
  DEEPGRAM_API_KEY: <key>
  # TTS_MODEL: cartesia:sonic-2
  # CARTESIA_API_KEY: <key>
  # LLM: "provider:model" — google | deepseek | openai. Set the matching key.
  LLM_MODEL: google:gemini-3.6-flash
  GOOGLE_API_KEY: <key>
  # DEEPSEEK_API_KEY: <key>
  # OPENAI_API_KEY: <key>
  # Optional: enables the research specialist (web search / cited findings)
  # TAVILY_API_KEY: <key>
  USE_LANGGRAPH: "true"
  # Vector store seam (deploy/k8s/postgres.yaml, or managed Postgres with
  # the pgvector extension). Optional today. Password must match
  # postgres-secrets.
  DATABASE_URL: postgresql://voice:change-me@postgres:5432/voiceagent
